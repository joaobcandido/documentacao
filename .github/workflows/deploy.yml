name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # Altere para 'master' se a sua branch principal tiver esse nome

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm # Altere para 'yarn' ou 'pnpm' se você não usa npm

      - name: Install dependencies
        run: npm ci # Se usar yarn, altere para: yarn install --immutable

      - name: Build website
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build